# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    # editable install, so that the data folder is found in the repository
    post_install:
      - python -m pip install --no-cache-dir -e ".[docs]"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
